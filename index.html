<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email → HubSpot Deal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 20px; }
    h1 { margin-top: 0; }
    .card { background: #f5f5f7; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    textarea, input { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; box-sizing: border-box; }
    textarea { min-height: 180px; font-family: inherit; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    button { background: #0070f3; color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; }
    button:disabled { background: #999; }
    .status { padding: 10px; border-radius: 6px; margin-top: 12px; font-size: 14px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .loading { background: #e2e3e5; color: #383d41; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Email → HubSpot Deal</h1>

  <div class="card">
    <label for="email">Paste the client email</label>
    <textarea id="email" placeholder="Paste the full email body here..."></textarea>
    <button id="parseBtn" onclick="parseEmail()">Parse Email</button>
    <div id="parseStatus"></div>
  </div>

  <div class="card hidden" id="dealCard">
    <h2 style="margin-top:0;">Review deal details</h2>
    <label for="dealname">Deal name</label>
    <input id="dealname" type="text">
    <label for="amount">Amount ($)</label>
    <input id="amount" type="number" step="0.01">
    <label for="closedate">Close date</label>
    <input id="closedate" type="date">
    <label for="dealstage">Deal stage</label>
    <input id="dealstage" type="text" value="appointmentscheduled">
    <label for="description">Notes</label>
    <textarea id="description" style="min-height: 80px;"></textarea>
    <button id="createBtn" onclick="createDeal()">Create Deal in HubSpot</button>
    <div id="createStatus"></div>
  </div>

  <script>
    async function parseEmail() {
      const emailText = document.getElementById('email').value.trim();
      const statusEl = document.getElementById('parseStatus');
      const btn = document.getElementById('parseBtn');
      if (!emailText) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Please paste an email first.';
        return;
      }
      btn.disabled = true;
      statusEl.className = 'status loading';
      statusEl.textContent = 'Reading email and extracting deal info...';
      try {
        const response = await fetch('/api/parse-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailText })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to parse');
        document.getElementById('dealname').value = data.dealname || '';
        document.getElementById('amount').value = data.amount || '';
        document.getElementById('closedate').value = data.closedate || '';
        document.getElementById('description').value = data.description || '';
        document.getElementById('dealCard').classList.remove('hidden');
        statusEl.className = 'status success';
        statusEl.textContent = 'Email parsed. Review the fields below.';
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function createDeal() {
      const btn = document.getElementById('createBtn');
      const statusEl = document.getElementById('createStatus');
      const dealname = document.getElementById('dealname').value.trim();
      if (!dealname) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Deal name is required.';
        return;
      }
      const payload = {
        dealname,
        amount: document.getElementById('amount').value,
        closedate: document.getElementById('closedate').value,
        dealstage: document.getElementById('dealstage').value,
        description: document.getElementById('description').value
      };
      btn.disabled = true;
      statusEl.className = 'status loading';
      statusEl.textContent = 'Creating deal in HubSpot...';
      try {
        const response = await fetch('/api/create-deal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to create deal');
        statusEl.className = 'status success';
        statusEl.innerHTML = 'Deal created! HubSpot deal ID: <strong>' + data.id + '</strong>';
      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
